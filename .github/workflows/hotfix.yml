name: Hotfix Pipeline

on:
  push:
    branches:
      - 'hotfix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: 21
  GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.caching=true

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  # =================================================================
  # Job: Urgent validation
  # =================================================================
  urgent-validation:
    name: Urgent Hotfix Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup headless display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dev libglu1-mesa-dev

      - name: Build and run critical tests
        run: xvfb-run -a ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-test-results-${{ github.sha }}
          path: |
            **/build/test-results/
            **/build/reports/tests/
          retention-days: 30

      - name: Create commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const branchName = '${{ github.ref_name }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: jobStatus === 'success' ? 'success' : 'failure',
              target_url: runUrl,
              description: jobStatus === 'success'
                ? 'Hotfix validation passed - ready for review'
                : 'Hotfix validation failed - immediate attention required',
              context: 'hotfix-ci/validation'
            });

      - name: Create failure notification issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = '${{ github.ref_name }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Check if an issue already exists for this hotfix branch
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'hotfix,urgent',
              per_page: 100
            });

            const issueExists = existingIssues.data.some(issue =>
              issue.title.includes(branchName)
            );

            if (!issueExists) {
              const title = `🚨 Hotfix Failed: ${branchName}`;
              const body = `> [!CAUTION]
                            > ### Hotfix Validation: Failed
                            > The build for hotfix branch **${branchName}** failed. Immediate attention is required.
                            >
                            > **Commit:** ${context.sha.substring(0, 7)}
                            > **Workflow Run:** [View Details](${runUrl})
                            >
                            > Please review the logs and fix the issues before merging.`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['hotfix', 'urgent', 'ci-failure']
              });
            }
