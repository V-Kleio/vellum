name: Feature Branch CI

on:
  push:
    branches:
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: 21
  GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.caching=true

permissions:
  contents: read
  checks: write

jobs:
  # =================================================================
  # Job: Lightweight validation for feature branches
  # =================================================================
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Setup headless display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dev libglu1-mesa-dev

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain --no-daemon
        continue-on-error: true

      - name: Compile and run tests
        run: xvfb-run -a ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-results-${{ github.sha }}
          path: '**/build/test-results/'
          retention-days: 3
